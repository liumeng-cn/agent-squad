# 仅用于隔离 staging；生产环境须配置独立 TLS 入口及受控数据库迁移。
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agent_squad
      MYSQL_USER: squad
      MYSQL_PASSWORD: ${SQUAD_DB_PASSWORD:?请配置数据库密码}
      MYSQL_ROOT_PASSWORD: ${SQUAD_DB_ROOT_PASSWORD:?请配置隔离实例 root 密码}
    volumes:
      - staging_db:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/agent_squad
      SPRING_DATASOURCE_USERNAME: squad
      SPRING_DATASOURCE_PASSWORD: ${SQUAD_DB_PASSWORD:?数据库密码}
      AGENTSQUAD_IDENTITY_HMACKEY: ${SQUAD_IDENTITY_HMAC_KEY:?必须配置至少32字节随机密钥}
      AGENTSQUAD_IDENTITY_STRICT: "true"
      AGENTSQUAD_IDENTITY_ENFORCEUSERSTATUS: "true"
      AGENTSQUAD_VAULT_MASTERKEY: ${SQUAD_CONNECTION_SECRET_KEY:?须配置 Vault 主密钥}
    stop_grace_period: 30s
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/agent_squad
      SPRING_DATASOURCE_USERNAME: squad
      SPRING_DATASOURCE_PASSWORD: ${SQUAD_DB_PASSWORD:?数据库密码}
      AGENTSQUAD_AUTH_SECURECOOKIE: "true"
      AGENTSQUAD_IDENTITY_HMACKEY: ${SQUAD_IDENTITY_HMAC_KEY:?内部断言密钥}
      GATEWAY_BUSINESSSERVICEURL: http://server:18080
    ports:
      - "127.0.0.1:18081:18081"
    stop_grace_period: 30s
    depends_on:
      server: {condition: service_healthy}
    networks: [private]
networks:
  private:
volumes:
  staging_db:
