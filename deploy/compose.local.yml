{
  "services": {
    "db": {
      "image": "mysql:8.4",
      "ports": [
        "127.0.0.1:13306:3306"
      ],
      "environment": {
        "MYSQL_DATABASE": "agent_squad",
        "MYSQL_USER": "root",
        "MYSQL_PASSWORD": "test",
        "MYSQL_ROOT_PASSWORD": "test"
      },
      "volumes": [
        "local_db:/var/lib/mysql"
      ]
    }
  },
  "volumes": {
    "local_db": {}
  }
}
