<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#f8f9fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="248" height="960" rx="0" fill="#f0f3f4" stroke="#f0f3f4"/><rect x="24" y="28" width="36" height="36" rx="10" fill="#176858" stroke="#176858"/><text x="34" y="53" fill="white" font-size="20" font-weight="600">队</text><text x="72" y="52" fill="#17232e" font-size="22" font-weight="600">小队</text><text x="24" y="95" fill="#687782" font-size="13" font-weight="400">让任务协作完成</text><rect x="20" y="123" width="208" height="40" rx="8" fill="white" stroke="#e4e8ed"/><text x="36" y="149" fill="#17232e" font-size="14" font-weight="500">＋  新建对话</text><text x="24" y="205" fill="#687782" font-size="12" font-weight="500">最近对话</text><rect x="12" y="225" width="224" height="48" rx="8" fill="#e0eae6" stroke="#e0eae6"/><text x="28" y="255" fill="#176858" font-size="14" font-weight="500">日志与配置检查</text><text x="28" y="311" fill="#687782" font-size="14" font-weight="400">整理测试环境运行情况</text><text x="28" y="359" fill="#687782" font-size="14" font-weight="400">检查定时任务失败原因</text><text x="28" y="650" fill="#176858" font-size="14" font-weight="600">对话</text><text x="28" y="695" fill="#687782" font-size="14" font-weight="400">技能</text><text x="96" y="695" fill="#8b969e" font-size="11" font-weight="400">按需自动使用</text><text x="28" y="740" fill="#687782" font-size="14" font-weight="400">连接</text><text x="96" y="740" fill="#8b969e" font-size="11" font-weight="400">个人资源访问</text><text x="28" y="785" fill="#687782" font-size="14" font-weight="400">记忆</text><text x="96" y="785" fill="#8b969e" font-size="11" font-weight="400">明确保存的偏好</text><path d="M20 860h208" stroke="#e4e8ed"/><rect x="24" y="880" width="32" height="32" rx="16" fill="#dce6e1" stroke="#dce6e1"/><text x="34" y="902" fill="#176858" font-size="14" font-weight="400">刘</text><text x="68" y="894" fill="#17232e" font-size="13" font-weight="500">个人账号</text><text x="68" y="914" fill="#687782" font-size="11" font-weight="400">设置与退出</text><text x="284" y="44" fill="#17232e" font-size="19" font-weight="600">测试校验</text><text x="284" y="70" fill="#687782" font-size="12" font-weight="400">示例场景 · 确认后才会执行</text><rect x="1175" y="25" width="190" height="28" rx="14" fill="#edf0f5" stroke="#edf0f5"/><text x="1187" y="44" fill="#6b7180" font-size="12" font-weight="500">静态设计 · 示例</text><path d="M248 92h1192" stroke="#e4e8ed"/><rect x="302" y="125" width="120" height="28" rx="14" fill="#fcf2de" stroke="#fcf2de"/><text x="314" y="144" fill="#8b6322" font-size="12" font-weight="500">等待你的确认</text><text x="330" y="209" fill="#687782" font-size="13" font-weight="400">你</text><rect x="324" y="228" width="930" height="76" rx="12" fill="white" stroke="#e4e8ed"/><text x="348" y="272" fill="#17232e" font-size="17" font-weight="400">帮我校验这份测试配置，并给出校验报告。</text><rect x="302" y="344" width="34" height="34" rx="10" fill="#176858" stroke="#176858"/><text x="311" y="368" fill="white" font-size="18" font-weight="600">队</text><text x="350" y="369" fill="#17232e" font-size="15" font-weight="600">小队</text><text x="350" y="410" fill="#17232e" font-size="19" font-weight="500">需要运行一次隔离校验，请先确认。</text><rect x="350" y="440" width="904" height="340" rx="12" fill="white" stroke="#e4e8ed"/><rect x="350" y="440" width="904" height="60" rx="12" fill="#fcf7ec" stroke="#f0e6d0"/><text x="374" y="478" fill="#17232e" font-size="17" font-weight="600">运行测试配置校验</text><rect x="1100" y="455" width="128" height="28" rx="14" fill="#f6e9cb" stroke="#f6e9cb"/><text x="1112" y="474" fill="#8b6322" font-size="12" font-weight="500">需要确认</text><text x="374" y="535" fill="#687782" font-size="13" font-weight="400">执行环境</text><text x="500" y="535" fill="#17232e" font-size="15" font-weight="400">隔离沙箱 · 测试</text><text x="374" y="577" fill="#687782" font-size="13" font-weight="400">目标资源</text><text x="500" y="577" fill="#17232e" font-size="15" font-weight="400">上传的配置文件</text><text x="374" y="619" fill="#687782" font-size="13" font-weight="400">操作影响</text><text x="500" y="619" fill="#17232e" font-size="15" font-weight="400">读取配置并生成校验报告</text><text x="374" y="661" fill="#687782" font-size="13" font-weight="400">访问范围</text><text x="500" y="661" fill="#17232e" font-size="15" font-weight="400">本次任务文件；不修改业务系统</text><path d="M374 687h854" stroke="#e4e8ed"/><text x="374" y="718" fill="#687782" font-size="12" font-weight="400">仅批准本次操作，参数变化后需要重新确认。</text><rect x="952" y="717" width="112" height="40" rx="8" fill="white" stroke="#e4e8ed"/><text x="968" y="743" fill="#17232e" font-size="14" font-weight="500">拒绝</text><rect x="1080" y="717" width="150" height="40" rx="8" fill="#176858" stroke="#176858"/><text x="1096" y="743" fill="white" font-size="14" font-weight="500">同意并继续</text><rect x="302" y="818" width="1080" height="86" rx="12" fill="white" stroke="#e4e8ed"/><text x="326" y="855" fill="#687782" font-size="14" font-weight="400">请先处理上方确认，或停止当前任务。</text><rect x="1240" y="838" width="118" height="40" rx="8" fill="white" stroke="#e4e8ed"/><text x="1256" y="864" fill="#17232e" font-size="14" font-weight="500">停止任务</text><text x="320" y="934" fill="#687782" font-size="12" font-weight="400">确认依据来自服务器；不允许编辑参数或永久放行。</text><text x="374" y="746" fill="#687782" font-family="PingFang SC, sans-serif" font-size="12">有效至今天 16:40 · 示例时间</text></g></svg>