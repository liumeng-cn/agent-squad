spring:
  datasource:
    url: ${SQUAD_DB_URL}
    username: ${SQUAD_DB_USER}
    password: ${SQUAD_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SQUAD_DB_POOL_SIZE:10}
      minimum-idle: ${SQUAD_DB_MIN_IDLE:2}
  sql:
    init:
      mode: never

agentsquad:
  schema:
    expected-version: ${SQUAD_SCHEMA_EXPECTED_VERSION:2}
