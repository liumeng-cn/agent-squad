spring:
  sql:
    init:
      mode: never
server:
  address: 0.0.0.0
agentsquad:
  identity:
    strict: true
    enforce-user-status: true
  fault:
    after-inflight-exit: false

management:
  server:
    port: 18083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
