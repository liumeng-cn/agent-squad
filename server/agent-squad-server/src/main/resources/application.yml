spring:
  application:
    name: agent-squad-server
  profiles:
    default: local
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/agent_squad
    username: root
    password: test
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  address: 127.0.0.1
  port: 18080

logging:
  level:
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: OFF

agentsquad:
  identity:
    hmac-key:
    key-id: local-v1
    previous-hmac-key:
    previous-key-id:
    strict: false
    allow-unsigned-local: false
    enforce-user-status: false
  vault:
    master-key:
    master-key-id: local-v1
  budget:
    max-microunits-per-response: 5000000
    max-microunits-per-user: 50000000
    max-microunits-per-task: 5000000
  delivery:
    enabled: false
    poll-delay-ms: 1000
    admission:
      # C2 持久运行容量默认关闭，启用前必须验证 V3/V4 与 SDK 回收。
      enabled: false
      global-limit: 12
      per-user-limit: 2
  events:
    poll-threads: 4
    max-connections: 100
    max-connections-per-user: 5
  model:
    api-key:
    base-url:
    name:
  worker:
    model-profiles:
      default:
        provider: OPENAI_COMPATIBLE
        model-name:
        base-url:
        api-key:
        pricing-version: local-v1
        input-microunits-per-million-tokens: 1000000
        output-microunits-per-million-tokens: 1000000
        max-input-tokens: 8192
        max-output-tokens: 2048
    runtime-profiles:
      default:
        max-model-calls: 20
        max-tool-calls: 40
        max-recovery-attempts: 3
        model-request-timeout-seconds: 90
        tool-timeout-seconds: 30

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
