spring:
  reactor:
    context-propagation: auto
  data:
    redis:
      timeout: 300ms
      connect-timeout: 300ms
      repositories:
        enabled: false
  application:
    name: agent-squad-server
  profiles:
    default: local
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/agent_squad?stringtype=unspecified
    username: root
    password: test
    hikari:
      # 统一以 UTC 连接，避免 CURRENT_TIMESTAMP 默认值与 Java 写入的 UTC 时间相差时区偏移
      connection-init-sql: SET TIME ZONE 'UTC'
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  address: 127.0.0.1
  port: 18080

logging:
  structured:
    # 默认使用 Spring Boot 原生控制台格式；设置 SQUAD_LOG_FORMAT=logstash|ecs|gelf 可切换为结构化 JSON。
    format:
      console: ${SQUAD_LOG_FORMAT:}
  level:
    root: INFO
    com.agentsquad.squad: DEBUG
    # SQL 默认不打印；排查时临时调成 DEBUG，适配器只输出模板并过滤绑定值和结果行。
    com.agentsquad.squad.mapper: INFO
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: OFF
    # 供应商错误由业务层分类，SDK 传输日志可能包含完整响应正文。
    io.agentscope.core.model.transport.JdkHttpTransport: OFF

management:
  health:
    redis:
      # Redis是唤醒加速器，故障时数据库补偿继续，不阻断业务健康检查。
      enabled: false
  tracing:
    enabled: ${SQUAD_TRACING_ENABLED:true}
    propagation:
      type: w3c
    sampling:
      probability: ${SQUAD_TRACING_SAMPLE_RATE:0.1}
    opentelemetry:
      export:
        # 有界队列加异步批量导出，队列满时丢弃新 Span，不阻塞业务线程。
        max-queue-size: ${SQUAD_OTLP_MAX_QUEUE_SIZE:2048}
        max-batch-size: 512
        schedule-delay: 1s
        timeout: 3s
  otlp:
    tracing:
      endpoint: ${SQUAD_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      connect-timeout: 1s
      timeout: 3s
      export:
        # 默认不导出，未部署 Collector 时启动与业务不受影响。
        enabled: ${SQUAD_OTLP_TRACES_EXPORT_ENABLED:false}

agentsquad:
  scheduler:
    # 未知类型命令由低频任务隔离，正常投递扫描继续按原频率运行。
    command-unknown-sweep-delay-ms: 15000
    artifact-retention-delay-ms: ${agentsquad.artifact.retention.interval-ms:3600000}
    cancellation-settlement-delay-ms: ${agentsquad.cancel.settle-delay-ms:3000}
    command-delivery-compensation-delay-ms: ${agentsquad.redis-wakeup.compensation-delay-ms:1000}
    command-delivery-poll-delay-ms: ${agentsquad.delivery.poll-delay-ms:1000}
    conversation-cleanup-delay-ms: ${agentsquad.conversation.cleanup.delay-ms:2000}
    conversation-event-reconcile-delay-ms: ${agentsquad.events.reconcile-delay-ms:15000}
    local-session-stop-check-delay-ms: ${agentsquad.cancel.local-check-delay-ms:500}
    native-projection-poll-delay-ms: ${agentsquad.projection.poll-delay-ms:1000}
    operation-unknown-sweep-batch: ${agentsquad.operation.unknown-sweep-batch:50}
    operation-unknown-sweep-delay-ms: ${agentsquad.operation.unknown-sweep-delay-ms:15000}
    projection-wakeup-retry-delay-ms: ${agentsquad.projection.wakeup-retry-delay-ms:15000}
    redis-command-poll-delay-ms: ${agentsquad.redis-wakeup.poll-delay-ms:200}
    redis-conversation-reconnect-delay-ms: ${agentsquad.events.redis-reconnect-delay-ms:5000}
    redis-projection-poll-delay-ms: ${agentsquad.redis-wakeup.projection-poll-delay-ms:200}
    runtime-admission-audit-delay-ms: ${agentsquad.delivery.admission.audit-delay-ms:60000}
    sandbox-recovery-delay-ms: ${agentsquad.sandbox.recovery-interval-ms:30000}
    task-directive-scan-delay-ms: ${agentsquad.directive.poll-delay-ms:1000}
    worker-prune-delay-ms: ${agentsquad.worker.prune-delay-ms:60000}
  identity:
    hmac-key:
    key-id: local-v1
    previous-hmac-key:
    previous-key-id:
    strict: false
    allow-unsigned-local: false
    enforce-user-status: false
  vault:
    master-key:
    master-key-id: local-v1
  budget:
    max-microunits-per-response: ${SQUAD_BUDGET_MAX_MICROUNITS_PER_RESPONSE:5000000}
    max-microunits-per-user: ${SQUAD_BUDGET_MAX_MICROUNITS_PER_USER:50000000}
    max-microunits-per-task: ${SQUAD_BUDGET_MAX_MICROUNITS:5000000}
  redis-wakeup:
    enabled: false
    namespace: squad:local
    poll-delay-ms: 200
    projection-poll-delay-ms: 200
    # 其他目标/Worker入口尚未全部发提交后通知，暂保留原扫描周期。
    compensation-delay-ms: 1000
    reclaim-idle-ms: 90000
    capacity: 10000
  delivery:
    enabled: false
    poll-delay-ms: 1000
    admission:
      # C2 持久运行容量默认关闭，启用前必须验证 V3/V4 与 SDK 回收。
      enabled: false
      global-limit: 12
      per-user-limit: 2
  events:
    poll-threads: 4
    max-connections: 100
    max-connections-per-user: 5
  model:
    api-key:
    base-url:
    name:
  worker:
    model-profiles:
      default:
        provider: OPENAI_COMPATIBLE
        model-name:
        base-url:
        api-key:
        pricing-version: local-v1
        input-microunits-per-million-tokens: 1000000
        output-microunits-per-million-tokens: 1000000
        max-input-tokens: 8192
        max-output-tokens: 2048
    runtime-profiles:
      default:
        max-model-calls: 20
        max-tool-calls: 40
        max-recovery-attempts: 3
        model-request-timeout-seconds: 90
        tool-timeout-seconds: 30

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # XML resultType 查询直接使用下划线列名，自动映射到驼峰属性。
    map-underscore-to-camel-case: true
    log-impl: com.agentsquad.squad.config.SqlTemplateLog
