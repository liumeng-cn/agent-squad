spring:
  application:
    name: agent-squad-server
  profiles:
    default: local
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/agent_squad
    username: root
    password: test
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  address: 127.0.0.1
  port: 18080

logging:
  structured:
    format:
      console: ${SQUAD_LOG_FORMAT:logstash}
  level:
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: OFF

management:
  tracing:
    enabled: ${SQUAD_TRACING_ENABLED:true}
    propagation:
      type: w3c
    sampling:
      probability: ${SQUAD_TRACING_SAMPLE_RATE:0.1}
    opentelemetry:
      export:
        # 有界队列加异步批量导出，队列满时丢弃新 Span，不阻塞业务线程。
        max-queue-size: ${SQUAD_OTLP_MAX_QUEUE_SIZE:2048}
        max-batch-size: 512
        schedule-delay: 1s
        timeout: 3s
  otlp:
    tracing:
      endpoint: ${SQUAD_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      connect-timeout: 1s
      timeout: 3s
      export:
        # 默认不导出，未部署 Collector 时启动与业务不受影响。
        enabled: ${SQUAD_OTLP_TRACES_EXPORT_ENABLED:false}

agentsquad:
  identity:
    hmac-key:
    key-id: local-v1
    previous-hmac-key:
    previous-key-id:
    strict: false
    allow-unsigned-local: false
    enforce-user-status: false
  vault:
    master-key:
    master-key-id: local-v1
  budget:
    max-microunits-per-response: ${SQUAD_BUDGET_MAX_MICROUNITS_PER_RESPONSE:5000000}
    max-microunits-per-user: ${SQUAD_BUDGET_MAX_MICROUNITS_PER_USER:50000000}
    max-microunits-per-task: ${SQUAD_BUDGET_MAX_MICROUNITS:5000000}
  delivery:
    enabled: false
    poll-delay-ms: 1000
    admission:
      # C2 持久运行容量默认关闭，启用前必须验证 V3/V4 与 SDK 回收。
      enabled: false
      global-limit: 12
      per-user-limit: 2
  events:
    poll-threads: 4
    max-connections: 100
    max-connections-per-user: 5
  model:
    api-key:
    base-url:
    name:
  worker:
    model-profiles:
      default:
        provider: OPENAI_COMPATIBLE
        model-name:
        base-url:
        api-key:
        pricing-version: local-v1
        input-microunits-per-million-tokens: 1000000
        output-microunits-per-million-tokens: 1000000
        max-input-tokens: 8192
        max-output-tokens: 2048
    runtime-profiles:
      default:
        max-model-calls: 20
        max-tool-calls: 40
        max-recovery-attempts: 3
        model-request-timeout-seconds: 90
        tool-timeout-seconds: 30

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
