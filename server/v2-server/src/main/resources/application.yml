spring:
  application:
    name: agent-squad-v2
  profiles:
    default: local
  main:
    web-application-type: servlet

server:
  address: 127.0.0.1
  port: ${SQUAD_V2_PORT:18082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.agentsquad.squad: INFO
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: "OFF"

agentsquad:
  identity:
    identity-key: ${SQUAD_IDENTITY_KEY}
