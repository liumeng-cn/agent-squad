spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: '127.0.0.1'
      port: 16379
      password: 'abedcad54f9956c8ebfc446add9bf67e5eb010fe8e8647be'
      timeout: 2s
  cloud:
    openfeign:
      client:
        config:
          user-server:
            connectTimeout: 2000
            readTimeout: 3000
    gateway:
      server:
        webflux:
          routes:
            - id: user-register
              uri: ${services.user-server.url}
              predicates:
                - Path=/api/v2/users/register
                - Method=POST
              metadata:
                anonymous: true
            - id: user-profile
              uri: ${services.user-server.url}
              predicates:
                - Path=/api/v2/users/me
                - Method=GET,PATCH
              metadata:
                audience: user-server
            - id: chat
              uri: ${services.v2-server.url}
              predicates:
                - Path=/api/v2/chat/**
                - Method=GET,POST,PATCH
              metadata:
                audience: v2-server
          httpclient:
            connect-timeout: 2000
services:
  user-server:
    url: 'http://127.0.0.1:18083'
  v2-server:
    url: 'http://127.0.0.1:18082'
