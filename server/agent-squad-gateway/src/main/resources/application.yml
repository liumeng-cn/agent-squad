spring:
  application:
    name: agent-squad-gateway
  profiles:
    default: local
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/agent_squad
    username: squad
    password: ""

server:
  address: 127.0.0.1
  port: 18081

gateway:
  business-service-url: http://127.0.0.1:18080

agentsquad:
  identity:
    hmac-key: ""
    key-id: local-v1
    strict: false
  auth:
    # 账户与会话始终由数据库持久管理。
    # HTTPS 部署使用 secure-cookie: true；本地 HTTP 调试使用 false。
    secure-cookie: false
    bcrypt-strength: 10
    idle-timeout: 24h
    absolute-timeout: 7d
    touch-interval: 5m
    failure-window: 15m
    max-failures: 5
    lock-duration: 15m
    cleanup-interval-ms: 600000
    cleanup-initial-delay-ms: 60000

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

logging:
  level:
    com.agentsquad.squad.gateway: INFO
