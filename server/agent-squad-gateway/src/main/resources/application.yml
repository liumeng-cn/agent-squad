spring:
  application:
    name: agent-squad-gateway
  profiles:
    default: local
  sql:
    init:
      mode: never
  datasource:
    url: ${SQUAD_DB_URL:jdbc:mysql://127.0.0.1:13306/agent_squad}
    username: ${SQUAD_DB_USER:squad}
    password: ${SQUAD_DB_PASSWORD:}

server:
  address: ${SQUAD_SERVER_ADDRESS:127.0.0.1}
  port: 18081

gateway:
  business-service-url: ${SQUAD_BUSINESS_SERVICE_URL:http://127.0.0.1:18080}

agentsquad:
  identity:
    hmac-key: ${SQUAD_IDENTITY_HMAC_KEY:}
    key-id: ${SQUAD_IDENTITY_KEY_ID:local-v1}
    strict: ${SQUAD_IDENTITY_STRICT:false}
  auth:
    # 显式设置 database 启用多用户持久会话；旧 local 模式仅供单机本地开发。
    mode: ${SQUAD_AUTH_MODE:local}
    bootstrap:
      enabled: ${SQUAD_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${SQUAD_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${SQUAD_BOOTSTRAP_ADMIN_PASSWORD:}
      user-id: ${SQUAD_BOOTSTRAP_ADMIN_USER_ID:}
    username: ${SQUAD_LOCAL_USER:}
    password: ${SQUAD_LOCAL_PASSWORD:}
    user-id: ${SQUAD_LOCAL_USER_ID:00000000-0000-0000-0000-000000000001}
    role: ${SQUAD_LOCAL_ROLE:ADMIN}
    # 生产 HTTPS 部署必须设置 SQUAD_AUTH_SECURE_COOKIE=true；本地 HTTP 调试默认关闭。
    secure-cookie: ${SQUAD_AUTH_SECURE_COOKIE:false}
    bcrypt-strength: ${SQUAD_AUTH_BCRYPT_STRENGTH:10}
    idle-timeout: ${SQUAD_AUTH_IDLE_TIMEOUT:24h}
    absolute-timeout: ${SQUAD_AUTH_ABSOLUTE_TIMEOUT:7d}
    touch-interval: ${SQUAD_AUTH_TOUCH_INTERVAL:5m}
    failure-window: ${SQUAD_AUTH_FAILURE_WINDOW:15m}
    max-failures: ${SQUAD_AUTH_MAX_FAILURES:5}
    lock-duration: ${SQUAD_AUTH_LOCK_DURATION:15m}
    cleanup-interval-ms: ${SQUAD_AUTH_CLEANUP_INTERVAL_MS:600000}
    cleanup-initial-delay-ms: ${SQUAD_AUTH_CLEANUP_INITIAL_DELAY_MS:60000}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false

logging:
  level:
    com.agentsquad.squad.gateway: INFO
