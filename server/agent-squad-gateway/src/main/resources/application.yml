spring:
  application:
    name: agent-squad-gateway
  profiles:
    default: local
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/agent_squad
    username: squad
    password: ""

server:
  address: 127.0.0.1
  port: 18081

gateway:
  business-service-url: http://127.0.0.1:18080

agentsquad:
  scheduler:
    auth-cleanup-delay-ms: ${agentsquad.auth.cleanup-interval-ms:600000}
    auth-cleanup-initial-delay-ms: ${agentsquad.auth.cleanup-initial-delay-ms:60000}
  identity:
    hmac-key: ""
    key-id: local-v1
    strict: false
  auth:
    # 账户与会话始终由数据库持久管理。
    # HTTPS 部署使用 secure-cookie: true；本地 HTTP 调试使用 false。
    secure-cookie: false
    bcrypt-strength: 10
    idle-timeout: 24h
    absolute-timeout: 7d
    touch-interval: 5m
    failure-window: 15m
    max-failures: 5
    lock-duration: 15m
    cleanup-interval-ms: 600000
    cleanup-initial-delay-ms: 60000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    log-impl: com.agentsquad.squad.config.SqlTemplateLog

management:
  tracing:
    enabled: ${SQUAD_TRACING_ENABLED:true}
    propagation:
      type: w3c
    sampling:
      probability: ${SQUAD_TRACING_SAMPLE_RATE:0.1}
    opentelemetry:
      export:
        # 有界队列加异步批量导出，队列满时丢弃新 Span，不阻塞业务线程。
        max-queue-size: ${SQUAD_OTLP_MAX_QUEUE_SIZE:2048}
        max-batch-size: 512
        schedule-delay: 1s
        timeout: 3s
  otlp:
    tracing:
      endpoint: ${SQUAD_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      connect-timeout: 1s
      timeout: 3s
      export:
        # 默认不导出，未部署 Collector 时启动与业务不受影响。
        enabled: ${SQUAD_OTLP_TRACES_EXPORT_ENABLED:false}

logging:
  structured:
    # 默认使用 Spring Boot 原生控制台格式；设置 SQUAD_LOG_FORMAT=logstash|ecs|gelf 可切换为结构化 JSON。
    format:
      console: ${SQUAD_LOG_FORMAT:}
  level:
    root: INFO
    com.agentsquad.squad: DEBUG
    # MyBatis 只输出 SQL 模板，绑定值和结果行由日志适配器过滤。
    com.agentsquad.squad.mapper: DEBUG
