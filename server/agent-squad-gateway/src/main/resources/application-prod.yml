agentsquad:
  identity:
    strict: true
  auth:
    mode: database
    secure-cookie: true
spring:
  datasource:
    hikari:
      maximum-pool-size: 16
server:
  address: 0.0.0.0

management:
  server:
    port: 18082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
