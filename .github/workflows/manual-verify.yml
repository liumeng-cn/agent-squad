name: Manual verify (user-triggered)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent_squad
          MYSQL_ROOT_PASSWORD: test-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/workbench/package-lock.json
      - name: Build and compile Java (no automated test execution)
        run: mvn -f server/pom.xml -B -ntp -DskipTests package
      - name: Install and build frontend
        run: |
          npm --prefix web/workbench ci
          npm --prefix web/workbench run build
      - name: Manual tests remain required
        run: echo "Per user request, test execution is deferred to local regression."
